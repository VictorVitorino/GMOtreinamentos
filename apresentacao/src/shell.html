*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:radial-gradient(1400px 900px at 50% 40%,#EEF1F5 0%,#DCE2E9 100%);color:var(--navy-900);font-family:var(--fb);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--orange-500);outline-offset:3px;border-radius:4px}
img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%);transform-origin:center;overflow:hidden;overflow:clip;background:var(--off);border-radius:14px;box-shadow:0 18px 50px rgba(14,28,57,.28),0 0 0 1px rgba(14,28,57,.06)}

/* ---------- slides e superfícies ---------- */
.slide{position:absolute;inset:0;display:none;overflow:hidden;color:var(--navy-900);background-color:var(--off);
  background-image:linear-gradient(rgba(11,37,69,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(11,37,69,.045) 1px,transparent 1px);background-size:44px 44px}
.slide.active{display:block}
.slide.stage{background:radial-gradient(1100px 700px at 75% 20%,rgba(27,68,121,.55),transparent 60%),radial-gradient(900px 600px at 10% 90%,rgba(242,107,33,.10),transparent 60%),linear-gradient(160deg,var(--navy-900),var(--navy-950));color:#fff}
.slide.stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(163,184,214,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(163,184,214,.06) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(1200px 700px at 60% 40%,#000 30%,transparent 80%);mask-image:radial-gradient(1200px 700px at 60% 40%,#000 30%,transparent 80%);pointer-events:none}

/* ---------- coreografia de entrada ---------- */
[data-a]{opacity:0}
/* fill-mode backwards + estado final como base: depois da entrada, nada fica "animado" em repouso (o texto não vai para camada composta e fica nítido) */
.play [data-a]{opacity:1;animation:.8s var(--ease) backwards;animation-delay:calc(var(--d,0)*90ms + 140ms)}
.play [data-a=up]{animation-name:aUp}.play [data-a=fade]{animation-name:aF}.play [data-a=zoom]{animation-name:aZ}
.play [data-a=left]{animation-name:aL}.play [data-a=right]{animation-name:aR}.play [data-a=blur]{animation-name:aBl}
.play [data-a=pop]{animation-name:aPop;animation-timing-function:var(--spring)}
@keyframes aUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes aF{from{opacity:0}to{opacity:1}}
@keyframes aZ{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes aL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes aR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes aBl{from{opacity:0;filter:blur(12px)}to{opacity:1;filter:none}}
@keyframes aPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.kw{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .02em .12em;margin-bottom:-.12em}
.kw>span{display:inline-block;transform:translateY(110%)}
.play .kw>span{transform:none;animation:kUp .8s var(--ease) backwards;animation-delay:calc(var(--k,0)*70ms + 200ms)}
@keyframes kUp{from{transform:translateY(110%)}to{transform:none}}
.hl{position:relative;color:var(--orange-500);white-space:nowrap}
.stage .hl{color:var(--orange-400)}
.hl::after{content:"";position:absolute;left:0;right:0;bottom:-.04em;height:.09em;border-radius:2px;background:currentColor;transform:scaleX(0);transform-origin:left}
.play .hl::after{transform:none;animation:ul .7s var(--ease) backwards;animation-delay:1.05s}
@keyframes ul{from{transform:scaleX(0)}to{transform:none}}

/* ---------- chrome: topo, corpo, rodapé ---------- */
.top{position:absolute;left:0;right:0;top:0;height:66px;display:flex;align-items:center;gap:18px;padding:0 40px;z-index:6;border-bottom:1px solid var(--line);background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.stage .top{background:rgba(4,16,31,.35);border-bottom-color:rgba(163,184,214,.14)}
.brand{display:flex;align-items:center;gap:14px}
.brand-div{width:1px;height:28px;background:var(--line-strong)}.stage .brand-div{background:rgba(163,184,214,.25)}
.top-title{margin-left:20px;display:flex;flex-direction:column;line-height:1.2;white-space:nowrap}
.top-title span{font-family:var(--fm);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey-500)}
.top-title b{font-size:14px;font-weight:700;color:var(--navy-800)}
.stage .top-title span{color:var(--steel-300)}.stage .top-title b{color:#fff}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.pg{font-family:var(--fm);font-size:12px;color:var(--grey-500);white-space:nowrap}.pg b{color:var(--navy-800);font-weight:600}
.stage .pg{color:var(--steel-300)}.stage .pg b{color:#fff}
.srcx{display:none!important}
.foot{display:none!important;position:absolute;left:40px;right:40px;bottom:0;height:42px;display:flex;align-items:center;gap:16px;z-index:5;border-top:1px solid var(--line);font-size:11px;line-height:1.3;color:var(--grey-500)}
.stage .foot{border-top-color:rgba(163,184,214,.14);color:var(--steel-300)}
.foot .src{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;max-width:1360px}
.foot .src .more{font:inherit;font-weight:600;color:var(--navy-700);white-space:nowrap;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:2px}
.foot .src .more:hover{color:var(--orange-600);text-decoration-color:currentColor}
.stage .foot .src .more{color:var(--steel-200);text-decoration-color:rgba(163,184,214,.35)}
.foot .src b{font-family:var(--fm);font-weight:600;letter-spacing:.1em;color:var(--navy-700);margin-right:8px}
.stage .foot .src b{color:var(--steel-200)}
.body{position:absolute;left:40px;right:40px;top:66px;bottom:42px;padding:22px 0 16px;display:flex;flex-direction:column;min-height:0}
.body>.main{flex:1;min-height:0;position:relative}
.am-logo{display:inline-block;flex:none;width:170px;height:27px;-webkit-mask:var(--am-logo) no-repeat center/contain;mask:var(--am-logo) no-repeat center/contain;
  background:linear-gradient(100deg,#fff 0%,#fff 40%,#A3B8D6 47%,#FF8A4C 52%,#fff 60%,#fff 100%);background-size:280% 100%;animation:shimmer 7s linear infinite}
.slide:not(.stage):not(.cover) .am-logo{background-image:linear-gradient(100deg,#0B2545 0%,#0B2545 40%,#4A6FA5 47%,#F26B21 52%,#0B2545 60%,#0B2545 100%)}
@keyframes shimmer{0%{background-position:130% 0}100%{background-position:-130% 0}}
.dts-logo{height:27px;width:auto}
.slide:not(.stage):not(.cover) .dts-logo{filter:brightness(0) saturate(100%) invert(11%) sepia(39%) saturate(2650%) hue-rotate(197deg) brightness(92%)}

/* ---------- tipografia ---------- */
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:40px;margin-bottom:20px;flex:none}
.hd-r{display:flex;flex-direction:column;align-items:flex-end;gap:10px;padding-bottom:4px}
.eyebrow{font-family:var(--fm);font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--orange-600);margin-bottom:10px;white-space:nowrap}
.stage .eyebrow{color:var(--orange-400)}
.h2{font-weight:800;font-size:40px;line-height:1.08;letter-spacing:-.03em;color:var(--navy-900);white-space:nowrap}
.stage .h2{color:#fff}
.lead{font-size:15px;line-height:1.5;color:var(--grey-700);max-width:470px;text-align:right}
.lead b{color:var(--navy-800)}
.stage .lead{color:var(--steel-200)}.stage .lead b{color:#fff}
.label{font-family:var(--fm);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--grey-500);white-space:nowrap}
.stage .label{color:var(--steel-300)}
.hint{display:inline-flex;align-items:center;gap:8px;font-family:var(--fm);font-size:11.5px;letter-spacing:.08em;color:var(--grey-500);white-space:nowrap}
.hint::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange-500);box-shadow:0 0 0 4px rgba(242,107,33,.18)}
.stage .hint{color:var(--steel-300)}
kbd{font-family:var(--fm);font-size:.92em;padding:1px 6px;border-radius:5px;border:1px solid currentColor;opacity:.9}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;box-shadow:0 1px 2px rgba(11,37,69,.06),0 4px 12px rgba(11,37,69,.06)}
.card.nv{background:linear-gradient(155deg,#16396B 0%,#0B2545 55%,#071A33 100%);border-color:var(--navy-800);color:#fff;box-shadow:0 18px 40px rgba(11,37,69,.22)}
.stage .card{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);box-shadow:none;color:#fff}
.srcx{font-family:var(--fm);font-size:9.5px;letter-spacing:.02em;color:var(--grey-400)}
.stage .srcx,.card.nv .srcx{color:var(--steel-300)}
.beacon{position:relative;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange-500);flex:none}
.beacon::before,.beacon::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--orange-500);animation:bc 2.4s ease-out infinite}
.beacon::after{animation-delay:1.2s}
@keyframes bc{from{transform:scale(1);opacity:.85}to{transform:scale(3.4);opacity:0}}
/* light sweep (Guia DTS · efeito 06) */
.sweep{position:relative;overflow:hidden;isolation:isolate}
.sweep::after{content:"";position:absolute;inset:-50%;pointer-events:none;z-index:5;mix-blend-mode:screen;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.10) 46%,rgba(255,255,255,.45) 50%,rgba(255,138,76,.32) 54%,transparent 60%);transform:translateX(-80%);animation:hsweep 5.2s var(--ease-io) infinite;animation-delay:var(--hd,1.2s)}
@keyframes hsweep{0%,60%{transform:translateX(-80%)}100%{transform:translateX(80%)}}
.glow{animation:glowP 3s ease-in-out infinite}
@keyframes glowP{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 0 18px 2px rgba(242,107,33,.30),0 18px 40px rgba(11,37,69,.25)}50%{box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 0 44px 10px rgba(242,107,33,.55),0 18px 40px rgba(11,37,69,.25)}}

/* ---------- personagens (Isabella) ---------- */
.char{position:absolute;pointer-events:none}
.char img{width:100%;height:auto;filter:drop-shadow(0 18px 22px rgba(4,16,31,.35))}
.char .floor{position:absolute;left:12%;right:12%;bottom:-10px;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(4,16,31,.38),transparent);z-index:-1}
.idle{animation:idle 4.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes idle{0%,100%{transform:rotate(-1deg) translateY(0)}50%{transform:rotate(1.2deg) translateY(-6px)}}
.bubble{position:absolute;background:#fff;color:var(--navy-900);border-radius:18px;padding:13px 16px;font-size:15px;line-height:1.38;font-weight:600;box-shadow:0 16px 40px rgba(4,16,31,.25);border:1px solid var(--line)}
.bubble b{color:var(--orange-600)}
.bubble::after{content:"";position:absolute;width:18px;height:18px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.bubble.tail-r::after{right:-9px;top:calc(50% - 9px);transform:rotate(-45deg)}
.bubble.tail-b::after{left:40px;bottom:-9px}
.bubble.tail-l::after{left:-9px;top:calc(50% - 9px);transform:rotate(135deg)}
.bubble .who{display:block;font-family:var(--fm);font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--grey-500);margin-bottom:4px}


/* ---------- pílula "hoje" do índice nas frentes ---------- */
.hj{margin-left:auto;font:700 13px var(--fb);font-style:normal;padding:5px 11px;border-radius:99px;white-space:nowrap}
.hj.ok{background:rgba(46,204,113,.16);color:#1E8E4F}.hj.am{background:#FFF3C4;color:#8A6100}.hj.ko{background:var(--orange-100);color:var(--orange-600)}
/* ---------- virar a página: o plano escrito (frentes do capítulo 5) ---------- */
/* sem 3D: em repouso nenhuma face tem transform, então o texto é desenhado na escala final (nítido) */
.pgwrap{flex:1;min-height:0;position:relative}
.pg3d{position:absolute;inset:0}
.pgface{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0;transition:opacity .32s var(--ease),transform .42s var(--ease),visibility 0s linear .42s}
.pgface.back{opacity:0;visibility:hidden;transform:translateY(18px)}
.pl-open .pgface.front{opacity:0;visibility:hidden;transform:translateY(-18px)}
.slide:not(.pl-open) .pgface.front,.pl-open .pgface.back{transition:opacity .4s var(--ease) .12s,transform .5s var(--ease) .12s,visibility 0s linear 0s}
.pl-open .pgface.back{opacity:1;visibility:visible;transform:none}
.pgbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 12px;border-radius:99px;background:var(--navy-800);color:#fff;font:600 12.5px var(--fb);white-space:nowrap;box-shadow:0 6px 16px rgba(11,37,69,.18);transition:background .25s,transform .3s var(--spring)}
.pgbtn:hover{background:var(--orange-600);transform:translateY(-1px)}
.pgbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pl-open .pgbtn.flip{background:var(--orange-500)}
.pldoc{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px rgba(11,37,69,.14);overflow:hidden}
.pldoc .plh{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--off),#fff)}
.pldoc .plh .plic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--navy-800)}
.pldoc .plh h3{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--navy-900)}
.pldoc .plh h3 small{display:block;font:500 11px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--grey-500);margin-top:2px}
.pldoc .plh .plchips{margin-left:auto;display:flex;gap:6px}
.pldoc .plh .plchips span{padding:4px 10px;border-radius:99px;font:600 11px var(--fm);background:var(--steel-100);color:var(--navy-800);white-space:nowrap}
.pldoc .plh .plchips span.hi{background:var(--orange-100);color:var(--orange-600)}
.pltab{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 10px}
.pltab .plr{flex:1;display:grid;grid-template-columns:var(--cols);gap:0 12px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.3;color:var(--grey-700)}
.pltab .plr.hd{flex:none;margin:0;font:600 10px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--steel-500);border-bottom:2px solid var(--line-strong);padding:9px 12px 7px}
.pltab .plr:nth-child(even):not(.hd){background:var(--off);border-radius:8px}
.pltab .plr b{color:var(--navy-900);font-weight:700}
.pltab .plr .tag{display:inline-block;padding:2px 8px;border-radius:99px;font:600 11px var(--fm);background:var(--steel-100);color:var(--navy-800);white-space:nowrap;margin:1px 0}
.pltab .plr .tag.hi{background:var(--orange-100);color:var(--orange-600)}.pltab .plr .tag.ok{background:rgba(46,204,113,.14);color:#1E8E4F}.pltab .plr .tag.nv{background:var(--navy-800);color:#fff}
.pldoc .plf{flex:none;display:flex;align-items:center;gap:14px;padding:9px 22px;border-top:1px solid var(--line);font-size:13px;color:var(--grey-500)}
.pldoc .plf .pgbtn{margin-left:auto}

/*@SLIDE_CSS@*/
/* =====================================================================
   FERNANDO (tecla N)
   ===================================================================== */
#fern{position:absolute;inset:0;z-index:80;pointer-events:none;overflow:hidden;overflow:clip}
#fern .fig{position:absolute;width:300px;transition:transform .7s var(--spring),opacity .3s}
#fern .fig img{width:100%;max-height:560px;object-fit:contain;filter:drop-shadow(0 16px 26px rgba(4,16,31,.45))}
#fern .fb{position:absolute;max-width:380px;background:#fff;color:var(--navy-900);border-radius:22px;padding:16px 20px;font-size:24px;line-height:1.25;font-weight:800;letter-spacing:-.02em;box-shadow:0 24px 50px rgba(4,16,31,.35);border:3px solid var(--orange-500);opacity:0;transform:scale(.4);visibility:hidden;pointer-events:none;transition:opacity .25s,transform .5s var(--spring),visibility 0s .5s}
#fern .fb small{display:block;font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--orange-600);margin-bottom:6px}
#fern .fb button{margin-top:12px;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:99px;background:var(--orange-500);color:#fff;font-size:13px;font-weight:700;letter-spacing:0;box-shadow:0 6px 14px rgba(242,107,33,.25)}
#fern .fb button:hover{background:var(--orange-600)}
#fern.on .fb{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition-delay:.25s,.25s,0s}
/* posições */
#fern.p-right .fig{right:-34px;bottom:40px;transform:translateX(130%) rotate(-14deg)}
#fern.p-right.on .fig{transform:translateX(0) rotate(-14deg)}
#fern.p-right .fb{right:250px;bottom:370px;transform-origin:100% 100%}
#fern.p-bottom .fig{left:120px;bottom:-60px;transform:translateY(120%)}
#fern.p-bottom.on .fig{transform:translateY(0)}
#fern.p-bottom .fb{left:400px;bottom:240px;transform-origin:0 100%}
#fern.p-left .fig{left:-34px;bottom:120px;transform:translateX(-130%) scaleX(-1) rotate(-14deg)}
#fern.p-left.on .fig{transform:translateX(0) scaleX(-1) rotate(-14deg)}
#fern.p-left .fb{left:280px;bottom:420px;transform-origin:0 100%}
#fern.p-top .fig{right:240px;top:-70px;transform:translateY(-130%) rotate(180deg)}
#fern.p-top.on .fig{transform:translateY(0) rotate(180deg);animation:dangle 2.6s ease-in-out .7s infinite}
@keyframes dangle{0%,100%{transform:rotate(180deg)}50%{transform:rotate(174deg)}}
#fern.p-top .fb{right:560px;top:120px;transform-origin:100% 0;max-width:430px}
#fern .fb .wave{display:inline-block;animation:wave 1s ease-in-out infinite;transform-origin:70% 80%}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}

/* =====================================================================
   ROGERINHO (tecla R): atravessa a tela a cavalo
   ===================================================================== */
#rog{position:absolute;left:0;bottom:46px;width:430px;z-index:90;pointer-events:none;transform:translateX(-120%)}
#rog img{width:100%;display:block;filter:drop-shadow(0 18px 22px rgba(4,16,31,.4));transform-origin:50% 90%}
#rog.go{animation:rogRun 6.2s linear forwards}
#rog.go img{animation:rogTrot .46s ease-in-out infinite}
@keyframes rogRun{from{transform:translateX(-120%)}to{transform:translateX(1700px)}}
@keyframes rogTrot{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-22px) rotate(2.5deg)}}
#rog b{position:absolute;left:62%;top:-26px;background:#fff;color:var(--navy-900);font:800 22px var(--fb);padding:8px 16px;border-radius:18px 18px 18px 4px;box-shadow:0 10px 24px rgba(4,16,31,.3);white-space:nowrap}

   RODA DA MUDANÇA (tecla W)

.wh-top{position:absolute;left:60px;right:60px;top:40px;display:flex;align-items:center;justify-content:space-between}

.wh-x{height:36px;padding:0 16px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);font-weight:700;font-size:14px}

#wheel.fun .wh-card .q{font-size:32px}
#whIsa{position:absolute;left:585px;top:270px;width:215px;display:none;z-index:4}

#whMaisa{position:absolute;left:775px;top:455px;width:150px;display:none;z-index:4}

#whMaisa i{position:absolute;left:10%;right:10%;bottom:-6px;height:18px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45),transparent);z-index:-1}
#whMaisa .bub{position:absolute;left:-20px;top:-58px;min-width:190px;text-align:center;padding:8px 14px;border-radius:18px;background:#FFE3EF;color:#B01357;font-weight:900;font-size:21px;line-height:1.1;border:3px solid #FF5FA2;box-shadow:0 12px 26px rgba(0,0,0,.4);opacity:0;transform:scale(.4) rotate(6deg);transition:opacity .12s,transform .25s var(--spring);white-space:nowrap}
#whMaisa .bub::after{content:"";position:absolute;left:52%;bottom:-12px;width:18px;height:18px;background:#FFE3EF;border-right:3px solid #FF5FA2;border-bottom:3px solid #FF5FA2;transform:rotate(45deg)}
#whMaisa .bub.on{opacity:1;transform:scale(1) rotate(var(--rt,0deg))}
#whMaisa.talk img{animation:maisaJump .3s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes maisaJump{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-16px) rotate(3deg)}}
#whIsa img{width:100%;display:block;filter:drop-shadow(0 18px 24px rgba(0,0,0,.5))}
#whIsa i{position:absolute;left:12%;right:12%;bottom:-8px;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45),transparent);z-index:-1}
#whIsa .bub{position:absolute;left:-60px;top:-62px;min-width:250px;text-align:center;padding:10px 18px;border-radius:20px;background:#fff;color:var(--navy-900);font-weight:900;font-size:26px;letter-spacing:-.02em;line-height:1.1;border:3px solid var(--orange-500);box-shadow:0 14px 30px rgba(0,0,0,.4);opacity:0;transform:scale(.4) rotate(-6deg);transition:opacity .12s,transform .25s var(--spring);white-space:nowrap}
#whIsa .bub::after{content:"";position:absolute;left:46%;bottom:-13px;width:20px;height:20px;background:#fff;border-right:3px solid var(--orange-500);border-bottom:3px solid var(--orange-500);transform:rotate(45deg)}
#whIsa .bub.on{opacity:1;transform:scale(1) rotate(var(--rt,0deg))}
#whIsa.talk img{animation:isaShout .22s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes isaShout{from{transform:rotate(-2deg) translateY(0)}to{transform:rotate(2deg) translateY(-8px)}}
.wh-x.wh-fun{border-color:var(--orange-400);background:rgba(242,107,33,.18)}
#wheel.fun .wh-hub{box-shadow:0 0 0 6px #FFC7A6,0 0 40px rgba(255,199,166,.6)}
.wh-x:hover{background:rgba(255,255,255,.14)}
.wh-wrap{position:absolute;left:110px;top:160px;width:640px;height:640px}
.wh-wrap::before{content:"";position:absolute;inset:8px;border-radius:50%;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.wh-svg{position:absolute;inset:0;width:640px;height:640px}
.wh-svg text{font-family:var(--fb);font-weight:800;font-size:19px;fill:#fff;letter-spacing:-.01em}
.wh-svg text.dk{fill:var(--navy-900)}

.wh-ptr{position:absolute;left:50%;top:-26px;width:52px;height:64px;margin-left:-26px;z-index:3;transform-origin:50% 20%}

.wh-ptr.tick{animation:tick .12s ease-out}
@keyframes tick{50%{transform:rotate(-16deg)}}
.wh-hub{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#16396B,#071A33);border:6px solid #fff;box-shadow:0 0 0 6px var(--orange-500),0 0 40px rgba(242,107,33,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:24px;letter-spacing:-.02em;z-index:2;transition:transform .2s var(--spring)}

.wh-card .cat{display:flex;align-items:center;justify-content:space-between}

.wh-timer{position:relative;width:74px;height:74px}

.wh-timer .f{stroke:var(--orange-500);stroke-dasharray:201;stroke-dashoffset:0;stroke-linecap:round}
.wh-timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fm);font-size:22px;font-weight:600}

.wh-card .ans{margin-top:22px;padding:18px 20px;border-radius:16px;background:rgba(242,107,33,.14);border:1px solid rgba(242,107,33,.45);font-size:20px;line-height:1.45;color:#fff;display:none}
.wh-card .ans.on{display:block;animation:aUp .5s var(--ease)}
.wh-card .ans b{color:var(--orange-200)}
.wh-card .ctl{display:flex;gap:10px;margin-top:auto;padding-top:22px}
.wh-btn{height:40px;padding:0 18px;border-radius:10px;font-weight:700;font-size:14px;background:var(--orange-500);color:#fff;box-shadow:0 6px 14px rgba(242,107,33,.25)}
.wh-btn:hover{background:var(--orange-600)}
.wh-btn.g{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);box-shadow:none}
.wh-btn.g:hover{background:rgba(255,255,255,.16)}
.wh-empty{margin:auto 0;text-align:center;color:var(--steel-200);font-size:20px;line-height:1.5}

.wh-score{font-family:var(--fm);font-size:12px;color:var(--steel-300);letter-spacing:.1em}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:90}

/* =====================================================================
   ROTEIRO (tecla S) e UI fora do palco
   ===================================================================== */
#wipe{position:absolute;inset:0;z-index:95;pointer-events:none;overflow:hidden;visibility:hidden}
#wipe i{position:absolute;top:-5%;bottom:-5%;left:-10%;width:120%;transform:translateX(-110%) skewX(-10deg)}
#wipe i:nth-child(1){background:var(--orange-500)}#wipe i:nth-child(2){background:var(--steel-500)}#wipe i:nth-child(3){background:var(--navy-900)}
#wipe.go{visibility:visible}
#wipe.go i{animation:wp .82s var(--ease-io) both}
#wipe.go i:nth-child(2){animation-delay:.06s}#wipe.go i:nth-child(3){animation-delay:.12s}
@keyframes wp{0%{transform:translateX(-110%) skewX(-10deg)}45%,55%{transform:translateX(0) skewX(-10deg)}100%{transform:translateX(110%) skewX(-10deg)}}
#blackout{position:fixed;inset:0;background:#000;z-index:200;display:none}
#toast{position:fixed;left:50%;bottom:58px;z-index:70;transform:translate(-50%,6px);padding:7px 12px;border-radius:7px;background:var(--navy-800);color:#fff;font:600 12px var(--fb);box-shadow:0 6px 16px rgba(14,28,57,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#blackout.on{display:block}
/* ---------- barra inferior (padrão AXON): trilha de capítulos + controles ---------- */
#rail{position:fixed;left:18px;bottom:13px;z-index:60;display:flex;gap:10px;align-items:flex-end;max-width:calc(100vw - 600px)}
#rail .sg{display:flex;flex-direction:column;gap:5px;cursor:pointer;background:none;text-align:left;width:max(44px,calc(var(--n)*7.6px + 12px))}
#rail .sg span{font:700 10px var(--fb);letter-spacing:.07em;text-transform:uppercase;color:#52627A;white-space:nowrap;transition:color .3s}
#rail .sg i{display:block;height:4px;border-radius:99px;background:#CFD8E2;position:relative;overflow:hidden}
#rail .sg i b{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--navy-700),var(--orange-500));transition:width .55s var(--ease)}
#rail .sg.on span{color:var(--navy-800)}
#rail .sg:hover span{color:var(--orange-600)}
@media (max-width:1100px){#rail{display:none}}
#controls{position:fixed;right:14px;bottom:10px;z-index:60;display:flex;gap:6px;align-items:center}
#controls button,#controls .c{height:32px;padding:0 12px;border-radius:7px;font:600 12px var(--fb);display:inline-flex;align-items:center;gap:7px;box-shadow:0 2px 8px rgba(14,28,57,.14);transition:background .2s,color .2s,transform .2s,box-shadow .2s}
#controls button:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(14,28,57,.2)}
#controls .g{background:#fff;color:var(--navy-800);border:1px solid #D7DDE2}
#controls .g:hover{border-color:var(--orange-400);color:var(--orange-600)}
#controls .g.on{background:var(--orange-500);border-color:var(--orange-500);color:#fff}
#controls .p{background:var(--orange-500);color:#fff;border:1px solid var(--orange-500)}
#controls .p:hover{background:var(--orange-600)}
#controls .c{background:var(--navy-800);color:#fff;font:600 11px var(--fm);letter-spacing:.04em;cursor:pointer;border:1px solid var(--navy-800)}
#controls .c::after{content:"▾";font-size:10px;opacity:.75}
#controls .c:hover,#controls .c.on{background:var(--navy-600)}
#controls button:disabled{opacity:.38;cursor:not-allowed;transform:none;box-shadow:none}

(()=>{

const boing=()=>{tone(220,.25,'triangle',.12,660)}, ding=()=>{tone(880,.18,'sine',.1);setTimeout(()=>tone(1320,.25,'sine',.08),110)};

/* ---------- navegação ---------- */
function show(n){const old=slides[cur],dir=n>cur?1:-1;old.classList.remove('active','play');H(cur).leave?.();cur=n;const s=slides[n];s.classList.add('active');void s.offsetWidth;s.classList.add('play');H(n).enter?.({dir});ui()}

const num=i=>String(i).padStart(2,'0');let BASE=0; /* índice da capa: a prévia vem antes e não conta */

/* rodapé FONTES: até 2 linhas, cortando sempre entre fontes inteiras; a lista completa fica no painel (I) */
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function fitFoot(s){const f=$('.foot .src',s),src=s.dataset.src;if(!f||!src||f.dataset.fit==='1'||(f.innerHTML&&!f.dataset.fit))return;
 const seg=src.split(' · '),put=k=>{f.innerHTML='<b>FONTES</b>'+esc(seg.slice(0,k).join(' · '))+(k<seg.length?` · <button type="button" class="more">+${seg.length-k} no painel “Sobre este slide” (I)</button>`:'')};

 I.classList.add('talk');M.classList.add('talk');shoutN=0;
 const pop=(el,t,rt)=>{el.classList.remove('on');void el.offsetWidth;el.textContent=t;el.style.setProperty('--rt',rt+'deg');el.classList.add('on')};
 const say=()=>{shoutN++;const w=['Playstation!','PLAYSTATION!!','Playstation!!!','PLAYSTATION!'][shoutN%4];pop(B,w,(shoutN%2?-1:1)*(3+shoutN%3));
  setTimeout(()=>pop(B2,['Eba! 🎉','Playstation!','Uhuul! 🎮','PLAYSTATION!'][shoutN%4],(shoutN%2?1:-1)*4),380);
  if(!DECK.muted){try{const u=new SpeechSynthesisUtterance('Playstation!');u.lang='pt-BR';u.rate=1.25;u.pitch=1.7;speechSynthesis.speak(u)}catch(e){}}};
 say();shoutT=setInterval(say,760)}
function spin(){if(spinning)return;if(used.size>=N)used.clear();spinning=true;hub.disabled=true;clearInterval(tmr);const id=++spinId;shout(true);
 let pick;do{pick=Math.floor(Math.random()*N)}while(used.has(pick));
 const target=360-(pick*seg+seg/2)+(Math.random()-.5)*seg*.6, base=rot-(rot%360), end=base+360*6+target, start=rot, dur=5200, t0=performance.now();let last=Math.floor(start/seg);
 const f=t=>{if(id!==spinId)return;const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,4);rot=start+(end-start)*e;svg.style.transform=`rotate(${rot}deg)`;const s=Math.floor(rot/seg);if(s!==last){last=s;ptr.classList.remove('tick');void ptr.offsetWidth;ptr.classList.add('tick');tone(1200,.03,'square',.03)}
  if(k<1)requestAnimationFrame(f);else{spinning=false;hub.disabled=false;shout(false);used.add(pick);draw();ask(pick)}};requestAnimationFrame(f)}
function ask(i){const q=CUR[i];ding();confetti();card.innerHTML=`<div class="cat"><span>${q.c} · pergunta ${used.size} de ${N}</span><div class="wh-timer" id="whT"><svg viewBox="0 0 74 74"><circle class="t" cx="37" cy="37" r="32"/><circle class="f" cx="37" cy="37" r="32"/></svg><b>20</b></div></div><p class="q">${q.q}</p><div class="ans" id="whA">${q.a||'Aqui não existe resposta certa: ganha a ideia mais criativa. A turma vota no aplauso! 👏'}</div><div class="ctl"><button class="wh-btn" id="whRev" type="button">${CUR===FUN?'Valendo aplausos 👏':'Revelar resposta'}</button><button class="wh-btn g" id="whAgain" type="button">🎡 Girar de novo</button></div>`;
 $('#whRev').onclick=()=>{$('#whA').classList.add('on');clearInterval(tmr);tone(660,.15,'sine',.07)};$('#whAgain').onclick=spin;
 let left=20;const T=$('#whT'),fc=$('.f',T),lb=$('b',T);clearInterval(tmr);tmr=setInterval(()=>{left--;lb.textContent=left;fc.style.strokeDashoffset=201*(1-left/20);if(left<=5){T.classList.add('late');tone(440,.06,'square',.04)}if(left<=0){clearInterval(tmr);tone(180,.5,'sawtooth',.08,90)}},1000)}
function confetti(){const cv=$('#confetti'),x=cv.getContext('2d'),P=[];for(let i=0;i<120;i++)P.push({x:1170,y:300,vx:(Math.random()-.5)*16,vy:-Math.random()*14-4,c:COLORS[i%COLORS.length],s:Math.random()*8+4,r:Math.random()*6});let n=0;const f=()=>{x.clearRect(0,0,1600,900);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}if(++n<110)requestAnimationFrame(f);else x.clearRect(0,0,1600,900)};f()}
openWheel=()=>{window.fernHide();W.classList.add('on');draw();if(!card.innerHTML)idle()};
closeWheel=()=>{shout(false);W.classList.remove('on');clearInterval(tmr);if(spinning){spinId++;spinning=false;hub.disabled=false;idle()}};
wheelOn=()=>W.classList.contains('on');
/* passador: → revela a resposta da pergunta na tela; se já revelada (ou sem pergunta), gira. ← esconde a resposta ou fecha */
wheelSpin=d=>{if(spinning)return;const a=$('#whA');if(d<0){if(a&&a.classList.contains('on'))a.classList.remove('on');else closeWheel();return}if(a&&!a.classList.contains('on'))$('#whRev').click();else spin()};
const setMode=fun=>{shout(false);CUR=fun?FUN:QS;N=CUR.length;seg=360/N;used.clear();clearInterval(tmr);spinId++;spinning=false;hub.disabled=false;rot=0;svg.style.transition='none';svg.style.transform='rotate(0deg)';void svg.offsetWidth;svg.style.transition='';
 $('#whKick').textContent=fun?'Quebra-gelo':'Rodada relâmpago';$('#whTitle').textContent=fun?'Roda da Alegria':'Roda da Mudança';$('#whMode').textContent=fun?'🎓 Voltar à Roda da Mudança':'😄 Roda da Alegria';W.classList.toggle('fun',fun);draw();idle()};
$('#whMode').onclick=()=>{$('#whMode').blur();setMode(CUR===QS)};
hub.onclick=spin;$('#whClose').onclick=closeWheel;$('#whReset').onclick=()=>{used.clear();clearInterval(tmr);draw();idle()};draw();idle()})();

/* ---------- SOBRE ESTE SLIDE (I) e ÍNDICE ---------- */
function renderInfo(){const s=slides[cur];$('#infoT').textContent=s.dataset.t;$('#infoD').innerHTML=$('template.info',s)?.innerHTML||'';}
const infoP=$('#infoP'),idxP=$('#idxP');
const togInfo=v=>{const on=v??!infoP.classList.contains('on');infoP.classList.toggle('on',on);infoP.inert=!on;$('#bInfo').classList.toggle('on',on);$('#bInfo').setAttribute('aria-expanded',on);if(on)togIdx(false)};
const togIdx=v=>{const on=v??!idxP.classList.contains('on');idxP.classList.toggle('on',on);idxP.inert=!on;$('#cnt').classList.toggle('on',on);if(on)togInfo(false)};
$('#idxL').onclick=e=>{const b=e.target.closest('.xi');if(b){togIdx(false);go(+b.dataset.i)}};
$('#bInfo').onclick=()=>togInfo();$('#cnt').onclick=()=>togIdx();$('#infoX').onclick=()=>togInfo(false);$('#idxX').onclick=()=>togIdx(false);
stage.addEventListener('click',e=>{if(e.target.closest('.foot .more'))togInfo(true)});
addEventListener('pointerdown',e=>{if(idxP.classList.contains('on')&&!e.target.closest('#idxP,#cnt'))togIdx(false);if(infoP.classList.contains('on')&&!e.target.closest('#infoP,#bInfo,.foot .more'))togInfo(false)});
/* clique com o mouse não deixa o foco preso no controle: Espaço/Enter seguem avançando o deck */
addEventListener('click',e=>{if(!e.detail)return;const b=e.target.closest?.('button,[role=button],[tabindex="0"]');if(b)setTimeout(()=>{if(document.activeElement===b)b.blur()})},true);

/* ---------- controles ---------- */
/* Rogerinho (R): passa a cavalo na frente da tela */
(()=>{const r=$('#rog');let t=null,clop=null;
window.rogerinho=()=>{if(r.classList.contains('go'))return;window.fernHide&&window.fernHide();r.classList.remove('go');void r.offsetWidth;r.classList.add('go');let n=0;clearInterval(clop);clop=setInterval(()=>{tone(n++%2?180:140,.07,'triangle',.05,100)},230);clearTimeout(t);t=setTimeout(()=>{r.classList.remove('go');clearInterval(clop)},6300)}})();

const fs=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
document.addEventListener('fullscreenchange',fit);
$('#bNext').onclick=next;$('#bPrev').onclick=prev;$('#bWheel').onclick=()=>openWheel();
const toast=t=>{const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1400)};
addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;const k=e.key;
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(k==='F5'){e.preventDefault();if(!document.fullscreenElement)fs();return}
 if($('#blackout').classList.contains('on')){$('#blackout').classList.remove('on');e.preventDefault();return}
 if(wheelOn()){if(k==='Escape'||k==='w'||k==='W')closeWheel();
  else if(k===' '||k==='Enter'||k==='PageDown'||k==='ArrowRight'){if(e.target.closest&&e.target.closest('button')&&(k===' '||k==='Enter'))return;e.preventDefault();wheelSpin(1)}
  else if(k==='PageUp'||k==='ArrowLeft'||k==='Backspace'){e.preventDefault();wheelSpin(-1)}
  else if(k==='b'||k==='B'||k==='.')$('#blackout').classList.add('on');
  else if(k==='s'||k==='S'){muted=!muted;toast(muted?'Som desligado (S)':'Som ligado (S)')}
  return}
 if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'){if(e.target.closest&&e.target.closest('button')&&(k===' '||k==='Enter'))return;e.preventDefault();next()}
 else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();prev()}
 else if(k==='Home')go(0);else if(k==='End')go(slides.length-1);
 else if(k==='w'||k==='W')openWheel();
 else if(k==='r'||k==='R')window.rogerinho();
 else if(k==='i'||k==='I')togInfo();
 else if(k==='t'||k==='T')fs();
 else if(CAST[k.toLowerCase()])window.cast(k.toLowerCase());
 else if(k==='s'||k==='S'){muted=!muted;toast(muted?'Som desligado (S)':'Som ligado (S)')}
 else if(k==='b'||k==='B'||k==='.')$('#blackout').classList.add('on');
 else if(k==='Escape'){window.fernHide();togInfo(false);togIdx(false)}
 else if(/^[0-9]$/.test(k)&&+k+BASE<slides.length)go(+k+BASE)});
$('#blackout').onclick=()=>$('#blackout').classList.remove('on');
/* links internos (#numeros, #5) também funcionam com a página aberta */
const fromHash=()=>{let h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(_){}let n=slides.findIndex(s=>s.dataset.id===h);if(n<0&&/^\d+$/.test(h))n=+h;return n>=0&&n<slides.length?n:-1};
addEventListener('hashchange',()=>{const n=fromHash();if(n>=0)go(n);else history.replaceState(null,'','#'+slides[cur].dataset.id)});

/* ---------- partida: chamada depois que todos os slides registraram seus ganchos ---------- */
DECK.start=()=>{slides=$$('.slide');BASE=Math.max(0,slides.findIndex(s=>s.dataset.id==='capa'));
 slides.forEach((s,i)=>{const src=s.dataset.src,f=$('.foot .src',s);if(src&&f&&!f.innerHTML){f.innerHTML='<b>FONTES</b>'+esc(src);f.dataset.fit='0'}const pg=$('.pg',s);if(pg)pg.innerHTML=`<b>${num(i-BASE)}</b> / ${num(slides.length-1-BASE)}`});
 /* trilha por capítulo: slides seguidos com o mesmo data-rail formam um só segmento */
 const G=[];slides.forEach((s,i)=>{const n=s.dataset.rail||s.dataset.t,l=G[G.length-1];if(l&&l.n===n)l.z=i;else G.push({n,a:i,z:i})});
 $('#rail').innerHTML=G.map(g=>`<button type="button" class="sg" data-i="${g.a}" data-z="${g.z}" style="--n:${Math.max(g.n.length,(g.z-g.a+1)*4)}"><span>${g.n}</span><i><b></b></i></button>`).join('');
 $('#rail').onclick=e=>{const b=e.target.closest('.sg');if(b)go(+b.dataset.i)};
 /* índice agrupado por sessão (mesmos grupos da trilha) */
 $('#idxL').innerHTML=G.map(g=>`<div class="xg">${g.n}</div>`+slides.slice(g.a,g.z+1).map((s,k)=>{const i=g.a+k;return `<button type="button" class="xi" data-i="${i}"><b>${i>BASE?num(i-BASE):''}</b>${s.dataset.t}</button>`}).join('')).join('');
 let n=fromHash();if(n<0)n=0;
 cur=n;slides[n].classList.add('active');H(n).enter?.({dir:0});ui();requestAnimationFrame(()=>slides[n].classList.add('play'));
 document.fonts?.ready.then(()=>fitFoot(slides[cur]));document.fonts?.addEventListener?.('loadingdone',()=>fitFoot(slides[cur]))};
})();
</script>
<!--@SLIDE_JS@-->
<script>DECK.start()</script>
