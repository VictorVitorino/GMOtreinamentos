<!-- ===================================================== 01 · AGENDA -->
<section data-id="agenda" class="slide ag" data-t="Agenda: a turma e o roteiro de hoje" data-rail="Agenda">
  <template class="info"><h5>Contexto</h5><p>Antes de começar, <b>a turma</b> e o <b>mapa do dia</b>. O treinamento tem três blocos: primeiro <b>entender a mudança</b> (o que acontece no cérebro, um exercício na sala e o que é gestão), depois <b>ver a evidência</b> (a história e os números) e, por fim, <b>pôr em prática</b> (as ferramentas e onde usar cada uma).</p><h5>Como usar</h5><ul><li>Toque num <b>crachá</b> e escreva o nome de cada pessoa.</li><li>Clique nos personagens: eles reagem.</li><li>Clique num tema do roteiro para ir direto a ele.</li></ul><h5>Em números</h5><div class="nums"><div><b>3</b><span>blocos</span></div><div><b>7</b><span>temas</span></div></div></template>
  <header class="top"><div class="brand"><span class="am-logo"></span><span class="brand-div"></span><img class="dts-logo" src="assets/logo-dts.png" alt="DTS"></div><div class="top-title"><span>Treinamento</span><b>Gestão de Mudanças</b></div><div class="top-right"><span class="pg"></span></div></header>
  <div class="body">
    <div class="hd">
      <div><div class="eyebrow" data-a="fade">01 · Agenda</div><h2 class="h2"><span class="kw" style="--k:1"><span>A galera está aqui.</span></span> <span class="kw" style="--k:3"><span class="hl">Bora ver o roteiro?</span></span></h2></div>
      <div class="hd-r" data-a="fade" style="--d:4"><span class="ag-pill">3 blocos · 7 temas</span></div>
    </div>
    <div class="main ag-grid">
      <div class="ag-crew card" data-a="left" style="--d:2">
        <i class="ag-blob b1"></i><i class="ag-blob b2"></i><i class="ag-dot d1"></i><i class="ag-dot d2"></i><i class="ag-dot d3"></i><i class="ag-dot d4"></i>
        <div class="ag-cap"><b>A galera de hoje</b><span>toque no crachá e escreva o nome</span></div>
        <div class="ag-row">
          <div class="ag-p" style="--i:0"><span class="ag-say"></span><img class="ag-img" src="assets/p1.webp" alt="Participante 1"><label class="ag-badge"><i>Olá, eu sou</i><b contenteditable="true" spellcheck="false" data-ph="seu nome" data-k="0"></b></label></div>
          <div class="ag-p" style="--i:1"><span class="ag-say"></span><img class="ag-img" src="assets/p2.webp" alt="Participante 2"><label class="ag-badge"><i>Olá, eu sou</i><b contenteditable="true" spellcheck="false" data-ph="seu nome" data-k="1"></b></label></div>
          <div class="ag-p" style="--i:2"><span class="ag-say"></span><img class="ag-img" src="assets/p3.webp" alt="Participante 3"><label class="ag-badge"><i>Olá, eu sou</i><b contenteditable="true" spellcheck="false" data-ph="seu nome" data-k="2"></b></label></div>
          <div class="ag-p" style="--i:3"><span class="ag-say"></span><img class="ag-img" src="assets/p4.webp" alt="Participante 4"><label class="ag-badge"><i>Olá, eu sou</i><b contenteditable="true" spellcheck="false" data-ph="seu nome" data-k="3"></b></label></div>

          <div class="ag-bh"><span>Bloco 1</span><b>Entender a mudança</b></div>
          <div class="ag-chips">
            <button type="button" class="ag-c" data-go="mudanca"><em>02</em><b>Mudança</b><span>o que acontece no cérebro</span></button>
