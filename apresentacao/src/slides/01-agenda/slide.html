  <template class="info"><h5>Contexto</h5><p>O mapa do dia em <b>cinco capítulos</b>. <b>Mudança</b>: o que acontece no cérebro quando mudamos, um exercício na sala e o que é gestão. <b>História</b>: como a forma de conduzir mudanças evoluiu e o que os números mostram. <b>Metodologias</b>: Kotter, ADKAR, HCMBOK e CMAK, e onde usar cada uma. <b>PEA</b>: prontidão, engajamento e adoção, e como medir cada palavra. <b>Na prática</b>: os indicadores do CMAK por frente, o roadmap de 3, 6 e 8 meses e as quatro frentes da GMO (comunicação, stakeholders, impactos e capacitação).</p><p>A ilustração é a linha de transmissão: as torres são os capítulos e a energia que corre nos cabos é a adoção (capítulo 4): só chega ao destino passando por todas.</p><h5>Como usar</h5><ul><li>Passe o mouse num capítulo: a torre dele acende.</li><li>Clique no capítulo (ou num dos temas) para abrir.</li></ul><h5>Em números</h5><div class="nums"><div><b>5</b><span>capítulos</span></div><div><b>15</b><span>temas</span></div></div></template>
